<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Looks by Lucian Alecu — Panou Frizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --card:#1c1c1c;
    --card2:#242424;
    --line:#333333;
    --gold:#d4a843;
    --gold-dim:#8a6f2e;
    --text:#f2ede2;
    --muted:#9a9690;
    --danger:#c9564f;
    --ok:#5f9e6e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;}
  .screen{display:none;min-height:100vh;flex-direction:column;}
  .screen.active{display:flex;}
  #authScreen{align-items:center;justify-content:center;padding:24px;}
  .authBox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;}
  .authBox h1{font-size:24px;color:var(--gold);text-align:center;}
  .authBox p.sub{text-align:center;color:var(--muted);margin:6px 0 22px;font-size:13px;}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;font-family:'Inter',sans-serif;}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .btn{margin-top:22px;width:100%;padding:13px;border:none;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:15px;cursor:pointer;}
  .btn:disabled{opacity:0.5;}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10;}
  header h2{font-size:17px;color:var(--gold);}
  header .logout{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;}
  .navTabs{display:flex;border-bottom:1px solid var(--line);}
  .navTabs button{flex:1;padding:13px 6px;background:none;border:none;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;}
  .navTabs button.on{color:var(--gold);border-bottom-color:var(--gold);}
  .filters{display:flex;gap:8px;padding:14px 18px 0;flex-wrap:wrap;}
  .filters button{flex:1;min-width:80px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;}
  .filters button.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);}
  .btnSterge{background:none;border:1px solid var(--line);color:var(--muted);}
  .clientCard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--card);}
  .clientCard .client{font-weight:700;font-size:15px;}
  .clientCard .contact{color:var(--text);font-size:14px;margin-top:2px;}
  .clientCard .contact a{color:var(--gold);text-decoration:none;}
  .clientCard .habitRow{display:flex;justify-content:space-between;margin-top:10px;gap:10px;flex-wrap:wrap;}
  .clientCard .habitBox{flex:1;min-width:100px;background:var(--card2);border-radius:10px;padding:8px 10px;}
  .clientCard .habitBox .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.03em;}
  .clientCard .habitBox .val{font-size:14px;font-weight:700;margin-top:2px;color:var(--gold);}
  .dateRow{padding:12px 18px 0;}
  main{flex:1;padding:16px 18px;padding-bottom:40px;}
  .apptItem{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--card);}
  .apptItem .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .apptItem .ora{font-weight:700;font-size:17px;color:var(--gold);}
  .apptItem .data2{color:var(--muted);font-size:12px;margin-top:2px;}
  .apptItem .status{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;white-space:nowrap;}
  .status.activa{background:rgba(212,168,67,0.15);color:var(--gold);}
  .status.finalizata{background:rgba(95,158,110,0.15);color:var(--ok);}
  .status.anulata{background:rgba(201,86,79,0.15);color:var(--danger);}
  .apptItem .client{font-weight:700;font-size:15px;margin-top:10px;}
  .apptItem .contact{color:var(--text);font-size:14px;margin-top:2px;}
  .apptItem .contact a{color:var(--gold);text-decoration:none;}
  .apptItem .det{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5;}
  .apptItem .actions{display:flex;gap:8px;margin-top:12px;}
  .apptItem .actions button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btnFin{background:var(--ok);border:1px solid var(--ok);color:#0f1c12;}
  .btnAnul{background:none;border:1px solid var(--danger);color:var(--danger);}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  .spinner{border:2px solid var(--line);border-top:2px solid var(--gold);border-radius:50%;width:16px;height:16px;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .sectionTitle{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:16px 0 8px;}
  /* CALENDAR */
  .calHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;}
  .calHeader button{background:none;border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer;}
  .calHeader .calLabel{font-family:'Fraunces',serif;font-size:16px;color:var(--gold);text-transform:capitalize;}
  .calLegend{display:flex;gap:14px;padding:10px 18px 0;font-size:11px;color:var(--muted);}
  .calLegend span{display:inline-flex;align-items:center;gap:5px;}
  .calLegend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .calWeekHead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 18px 4px;font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;}
  .calGridDays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 18px 18px;}
  .calCell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;}
  .calCell.empty2{border:none;background:none;cursor:default;}
  .calCell.selected{border-color:var(--gold);background:var(--card2);}
  .calCell .calNr{font-size:13px;font-weight:600;}
  .calCell .calDot{width:7px;height:7px;border-radius:50%;margin-top:4px;}
  .calDot.verde,i.verde{background:var(--ok);}
  .calDot.galben,i.galben{background:var(--gold);}
  .calDot.rosu,i.rosu{background:var(--danger);}
  .calDayPanel{padding:0 18px 30px;}
  .calDayPanel h3{color:var(--gold);font-size:15px;margin-bottom:12px;}
  .apptItem .actions button.btnMuta{background:none;border:1px solid var(--gold);color:var(--gold);}
  /* MODAL MUTA PROGRAMARE */
  .modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center;}
  .modalBg.active{display:flex;}
  .modalBox{background:var(--card);border-radius:18px 18px 0 0;padding:24px 20px 30px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;}
  .modalBox h3{color:var(--gold);margin-bottom:14px;font-size:17px;}
  .slotsGridAdmin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .slotAdmin{padding:10px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;}
  .slotAdmin.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);}
  .modalBox .btn{margin-top:18px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:14px;cursor:pointer;}
  .modalBox .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .modalBox .btn:disabled{opacity:0.5;}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="authScreen" class="screen active">
  <div class="authBox">
    <h1>Panou Frizer</h1>
    <p class="sub">Looks by Lucian Alecu</p>
    <label>Frizer</label>
    <select id="pinFrizer"></select>
    <label>Cod PIN</label>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="btn" id="btnPin" onclick="verificaPin()">Intră</button>
    <div class="err" id="pinErr"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen" class="screen">
  <header>
    <h2 id="headerNume">Panou Frizer</h2>
    <button class="logout" onclick="iesi()">Ieși</button>
  </header>

  <div class="navTabs">
    <button id="tabNavProgramari" class="on" onclick="switchTab('programari')">Programări</button>
    <button id="tabNavCalendar" onclick="switchTab('calendar')">Calendar</button>
    <button id="tabNavClienti" onclick="switchTab('clienti')">Clienți</button>
  </div>

  <div id="tabProgramari">
    <div class="filters">
      <button id="fAzi" class="on" onclick="setFiltru('azi')">Azi</button>
      <button id="fViitor" onclick="setFiltru('viitor')">Viitoare</button>
      <button id="fToate" onclick="setFiltru('toate')">Toate</button>
    </div>
    <div class="dateRow" id="dateRow" style="display:none;">
      <input type="date" id="dataInput" onchange="incarcaProgramari()">
    </div>
    <main>
      <div id="lista"></div>
    </main>
  </div>

  <div id="tabCalendar" style="display:none;">
    <div class="calHeader">
      <button onclick="schimbaLuna(-1)">‹</button>
      <div class="calLabel" id="calLabel"></div>
      <button onclick="schimbaLuna(1)">›</button>
    </div>
    <div class="calLegend">
      <span><i class="verde"></i> Puțin ocupat</span>
      <span><i class="galben"></i> Aproape plin</span>
      <span><i class="rosu"></i> Complet</span>
    </div>
    <div id="calGrid"></div>
    <div class="calDayPanel" id="calDayPanel"></div>
  </div>

  <div id="tabClienti" style="display:none;">
    <main>
      <div id="listaClienti"></div>
    </main>
  </div>
</div>

<!-- MODAL MUTA PROGRAMARE -->
<div class="modalBg" id="mutaModal">
  <div class="modalBox">
    <h3>Mută programarea</h3>
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px;">Nouă dată</label>
    <input type="date" id="mutaDataInput" onchange="incarcaSloturiMutare()">
    <div id="mutaSlotsWrap"></div>
    <div class="err" id="mutaErr" style="color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;"></div>
    <button class="btn" id="btnConfirmaMutare" disabled onclick="confirmaMutarea()">Confirmă mutarea</button>
    <button class="btn secondary" onclick="inchideModalMutare()">Renunță</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAF-7h6_G5rz9wcyliSBF1ag7HqJu2zhNc",
  authDomain: "baby-white-noise-bc63d.firebaseapp.com",
  databaseURL: "https://baby-white-noise-bc63d.firebaseio.com",
  projectId: "baby-white-noise-bc63d",
  storageBucket: "baby-white-noise-bc63d.firebasestorage.app",
  messagingSenderId: "114240488049",
  appId: "1:114240488049:web:64fba858033092e775d1d0",
  measurementId: "G-7G3KKEFNQX"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ---------- CONFIG SALON (trebuie sa fie identic cu client.html) ----------
const FRIZERI = {
  lucian: { nume: "Lucian Alecu", initiale: "LA", pin: "1234" },
  teodor: { nume: "Teodor", initiale: "T", pin: "5678" }
};
// program: 0=Duminica,1=Luni,...6=Sambata (identic cu client)
const PROGRAM = {
  0: {start:"09:00", end:"17:00"},
  1: null, // inchis
  2: {start:"09:00", end:"20:30"},
  3: {start:"09:00", end:"20:30"},
  4: {start:"09:00", end:"20:30"},
  5: {start:"09:00", end:"20:30"},
  6: {start:"09:00", end:"20:30"}
};
const SLOT_STEP = 15; // minute

// ---------- STATE ----------
let selFrizer = null;
let filtruCurent = 'azi';
let calYear, calMonth;
let calSelectedDate = null;
let mutaState = null; // {apptId, uid, durataTotal, servicii}
let apptCache = {}; // apptId -> obiect programare, populat la fiecare incarcare a listelor

// ---------- PIN LOGIN ----------
function populeazaSelect(){
  const sel = document.getElementById('pinFrizer');
  sel.innerHTML = '';
  Object.keys(FRIZERI).forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = FRIZERI[id].nume;
    sel.appendChild(opt);
  });
}
populeazaSelect();

function verificaPin(){
  const id = document.getElementById('pinFrizer').value;
  const pin = document.getElementById('pinInput').value.trim();
  const errEl = document.getElementById('pinErr');
  errEl.textContent = '';
  if(!pin){ errEl.textContent = 'Introdu codul PIN.'; return; }
  if(FRIZERI[id].pin !== pin){ errEl.textContent = 'Cod PIN greșit.'; return; }
  document.getElementById('btnPin').disabled = true;
  auth.signInAnonymously()
    .then(() => {
      selFrizer = id;
      sessionStorage.setItem('frizerSel', id);
      afiseazaApp();
    })
    .catch(e => { errEl.textContent = 'Eroare conectare: ' + e.message; })
    .finally(() => { document.getElementById('btnPin').disabled = false; });
}

function iesi(){
  auth.signOut();
  selFrizer = null;
  sessionStorage.removeItem('frizerSel');
  document.getElementById('appScreen').classList.remove('active');
  document.getElementById('authScreen').classList.add('active');
  document.getElementById('pinInput').value = '';
}

auth.onAuthStateChanged(user => {
  if(user && sessionStorage.getItem('frizerSel')){
    selFrizer = sessionStorage.getItem('frizerSel');
    afiseazaApp();
  } else if(!user){
    document.getElementById('appScreen').classList.remove('active');
    document.getElementById('authScreen').classList.add('active');
  }
});

// ---------- APP UI ----------
function afiseazaApp(){
  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('appScreen').classList.add('active');
  document.getElementById('headerNume').textContent = FRIZERI[selFrizer].nume;
  const today = new Date();
  document.getElementById('dataInput').value = ymd(today);
  incarcaProgramari();
}

function switchTab(tab){
  document.getElementById('tabNavProgramari').classList.toggle('on', tab==='programari');
  document.getElementById('tabNavCalendar').classList.toggle('on', tab==='calendar');
  document.getElementById('tabNavClienti').classList.toggle('on', tab==='clienti');
  document.getElementById('tabProgramari').style.display = tab==='programari' ? 'block' : 'none';
  document.getElementById('tabCalendar').style.display = tab==='calendar' ? 'block' : 'none';
  document.getElementById('tabClienti').style.display = tab==='clienti' ? 'block' : 'none';
  if(tab === 'clienti') incarcaClienti();
  if(tab === 'calendar') initCalendar();
}

function toMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function toHHMM(min){ const h = Math.floor(min/60), m = min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

function setFiltru(f){
  filtruCurent = f;
  document.getElementById('fAzi').classList.toggle('on', f==='azi');
  document.getElementById('fViitor').classList.toggle('on', f==='viitor');
  document.getElementById('fToate').classList.toggle('on', f==='toate');
  document.getElementById('dateRow').style.display = f==='alta' ? 'block' : 'none';
  incarcaProgramari();
}

function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function incarcaProgramari(){
  const wrap = document.getElementById('lista');
  wrap.innerHTML = '<div class="empty"><span class="spinner"></span> Se încarcă programările...</div>';

  db.ref('programari/' + selFrizer).once('value').then(snap => {
    let items = [];
    snap.forEach(c => items.push(Object.assign({apptId:c.key}, c.val())));

    const today = ymd(new Date());
    if(filtruCurent === 'azi'){
      items = items.filter(it => it.data === today);
    } else if(filtruCurent === 'viitor'){
      items = items.filter(it => it.data >= today && it.status === 'activa');
    }
    // 'toate' = fara filtrare pe data

    items.sort((a,b) => (a.data+a.oraStart).localeCompare(b.data+b.oraStart));

    if(items.length === 0){
      wrap.innerHTML = '<div class="empty">Nu există programări pentru acest filtru.</div>';
      return;
    }

    wrap.innerHTML = '';
    items.forEach(it => wrap.appendChild(renderApptItem(it)));
  });
}

// Card reutilizabil pentru o programare, folosit atat in tab-ul Programari cat si in Calendar
function renderApptItem(it){
  apptCache[it.apptId] = it;
  const div = document.createElement('div');
  div.className = 'apptItem';
  const poateModifica = it.status === 'activa';
  div.innerHTML = `
    <div class="top">
      <div>
        <div class="ora">${it.oraStart} - ${it.oraEnd}</div>
        <div class="data2">${formatDataRo(it.data)}</div>
      </div>
      <div class="status ${it.status}">${it.status}</div>
    </div>
    <div class="client">${escapeHtml(it.nume) || 'Client necunoscut'}</div>
    <div class="contact">📞 <a href="tel:${it.telefon}">${it.telefon || '-'}</a></div>
    <div class="det">
      Servicii: ${(it.servicii||[]).map(s=>escapeHtml(s.nume)).join(', ')}<br>
      Total: ${it.pretTotal} RON · Durată: ${it.durataTotal} min
    </div>
    <div class="actions">
      ${poateModifica ? `
      <button class="btnFin" onclick="schimbaStatus('${it.apptId}','finalizata')">Finalizează</button>
      <button class="btnMuta" onclick="deschideModalMutare('${it.apptId}')">Mută</button>
      <button class="btnAnul" onclick="schimbaStatus('${it.apptId}','anulata')">Anulează</button>
      ` : ''}
      <button class="btnSterge" onclick="stergeProgramare('${it.apptId}','${it.uid||''}')">Șterge</button>
    </div>
  `;
  return div;
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function schimbaStatus(apptId, statusNou){
  if(statusNou === 'anulata' && !confirm('Sigur anulezi această programare?')) return;
  const item_ref = 'programari/' + selFrizer + '/' + apptId;
  db.ref(item_ref + '/uid').once('value').then(snapUid => {
    const uid = snapUid.val();
    const updates = {};
    updates[item_ref + '/status'] = statusNou;
    if(uid){
      updates['programariClienti/' + uid + '/' + apptId + '/status'] = statusNou;
    }
    return db.ref().update(updates);
  }).then(() => incarcaProgramari());
}

function stergeProgramare(apptId, uid){
  if(!confirm('Ștergi definitiv această programare? Nu se poate reveni.')) return;
  const updates = {};
  updates['programari/' + selFrizer + '/' + apptId] = null;
  if(uid){
    updates['programariClienti/' + uid + '/' + apptId] = null;
  }
  db.ref().update(updates).then(() => incarcaProgramari());
}

// ---------- CALENDAR ----------
function initCalendar(){
  const now = new Date();
  if(calYear === undefined){ calYear = now.getFullYear(); calMonth = now.getMonth(); }
  calSelectedDate = null;
  document.getElementById('calDayPanel').innerHTML = '';
  renderCalendar();
}

function schimbaLuna(delta){
  calMonth += delta;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  if(calMonth > 11){ calMonth = 0; calYear++; }
  calSelectedDate = null;
  document.getElementById('calDayPanel').innerHTML = '';
  renderCalendar();
}

// Calculeaza gradul de ocupare al unei zile: rosu = complet (nu mai exista niciun slot
// liber nici macar pentru cel mai scurt serviciu), galben = aproape plin, verde = liber
function calculeazaOcuparea(dataStr, programariZi){
  const d = new Date(dataStr + 'T00:00:00');
  const prog = PROGRAM[d.getDay()];
  const active = (programariZi || []).filter(a => a.status !== 'anulata');
  if(!prog || active.length === 0) return { stare: null, count: active.length };

  const start = toMin(prog.start), end = toMin(prog.end);
  const totalMinute = end - start;
  const ocupat = active.map(a => [toMin(a.oraStart), toMin(a.oraEnd)]);
  const minuteOcupate = ocupat.reduce((s,[a,b]) => s + (b-a), 0);

  const durataMinima = 15; // cel mai scurt serviciu posibil
  let existaLoc = false;
  for(let t = start; t + durataMinima <= end; t += SLOT_STEP){
    const suprapune = ocupat.some(([os,oe]) => t < oe && (t+durataMinima) > os);
    if(!suprapune){ existaLoc = true; break; }
  }

  let stare;
  if(!existaLoc){
    stare = 'rosu';
  } else if(active.length < 3){
    stare = 'verde';
  } else {
    stare = (minuteOcupate / totalMinute) >= 0.7 ? 'galben' : 'verde';
  }
  return { stare, count: active.length };
}

function renderCalendar(){
  const wrap = document.getElementById('calGrid');
  const label = document.getElementById('calLabel');
  const luni = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
  label.textContent = luni[calMonth] + ' ' + calYear;
  wrap.innerHTML = '<div class="empty"><span class="spinner"></span> Se încarcă calendarul...</div>';

  db.ref('programari/' + selFrizer).once('value').then(snap => {
    const toate = [];
    snap.forEach(c => toate.push(Object.assign({apptId:c.key}, c.val())));

    const lunaStr = calYear + '-' + String(calMonth+1).padStart(2,'0');
    const perZi = {};
    toate.forEach(a => {
      if(a.data && a.data.startsWith(lunaStr)){
        if(!perZi[a.data]) perZi[a.data] = [];
        perZi[a.data].push(a);
      }
    });

    let dowFirst = new Date(calYear, calMonth, 1).getDay();
    dowFirst = (dowFirst + 6) % 7; // 0 = Luni
    const nrZile = new Date(calYear, calMonth+1, 0).getDate();
    const azi = ymd(new Date());

    wrap.innerHTML = '';
    const headerRow = document.createElement('div');
    headerRow.className = 'calWeekHead';
    ['L','Ma','Mi','J','V','S','D'].forEach(z => {
      const el = document.createElement('div'); el.textContent = z; headerRow.appendChild(el);
    });
    wrap.appendChild(headerRow);

    const grid = document.createElement('div');
    grid.className = 'calGridDays';
    for(let i=0;i<dowFirst;i++){
      const empty = document.createElement('div'); empty.className = 'calCell empty2';
      grid.appendChild(empty);
    }
    for(let d=1; d<=nrZile; d++){
      const dataStr = lunaStr + '-' + String(d).padStart(2,'0');
      const { stare } = calculeazaOcuparea(dataStr, perZi[dataStr]);
      const cell = document.createElement('div');
      cell.className = 'calCell' + (dataStr===azi ? ' selected' : '') + (dataStr===calSelectedDate ? ' selected' : '');
      cell.onclick = () => selecteazaZiCalendar(dataStr, perZi[dataStr] || []);
      cell.innerHTML = `<div class="calNr">${d}</div>${stare ? `<div class="calDot ${stare}"></div>` : ''}`;
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
  });
}

function selecteazaZiCalendar(dataStr, programariZi){
  calSelectedDate = dataStr;
  renderCalendar();
  const panel = document.getElementById('calDayPanel');
  const active = programariZi.filter(a => a.status !== 'anulata');
  active.sort((a,b) => a.oraStart.localeCompare(b.oraStart));

  panel.innerHTML = `<h3>${formatDataRo(dataStr)}</h3>`;
  if(active.length === 0){
    panel.innerHTML += '<div class="empty">Nicio programare în această zi.</div>';
    return;
  }
  active.forEach(it => panel.appendChild(renderApptItem(it)));
}

// ---------- MUTAREA (RESCHEDULE) PROGRAMARII ----------
function deschideModalMutare(apptId){
  const it = apptCache[apptId];
  if(!it) return;
  mutaState = { apptId: it.apptId, frizerId: selFrizer, uid: it.uid || '', durataTotal: it.durataTotal, data: it.data };
  document.getElementById('mutaDataInput').min = ymd(new Date());
  document.getElementById('mutaDataInput').value = it.data;
  document.getElementById('mutaSlotsWrap').innerHTML = '';
  document.getElementById('mutaErr').textContent = '';
  document.getElementById('btnConfirmaMutare').disabled = true;
  document.getElementById('mutaModal').classList.add('active');
  incarcaSloturiMutare();
}

function inchideModalMutare(){
  document.getElementById('mutaModal').classList.remove('active');
  mutaState = null;
}

function incarcaSloturiMutare(){
  if(!mutaState) return;
  const dataAleasa = document.getElementById('mutaDataInput').value;
  const wrap = document.getElementById('mutaSlotsWrap');
  document.getElementById('btnConfirmaMutare').disabled = true;
  document.getElementById('mutaErr').textContent = '';
  wrap.innerHTML = '<div class="empty"><span class="spinner"></span> Se caută ore libere...</div>';

  const d = new Date(dataAleasa + 'T00:00:00');
  const prog = PROGRAM[d.getDay()];
  if(!prog){
    wrap.innerHTML = '<div class="empty">Salonul este închis în ziua selectată.</div>';
    return;
  }

  db.ref('programari/' + mutaState.frizerId).orderByChild('data').equalTo(dataAleasa).once('value').then(snap => {
    const ocupat = [];
    snap.forEach(c => {
      const v = c.val();
      // excludem chiar programarea pe care o mutam din calculul suprapunerilor
      if(c.key === mutaState.apptId) return;
      if(v.status !== 'anulata') ocupat.push([toMin(v.oraStart), toMin(v.oraEnd)]);
    });
    const start = toMin(prog.start), end = toMin(prog.end);
    const now = new Date();
    const esteAzi = dataAleasa === ymd(now);
    const acumMin = now.getHours()*60 + now.getMinutes();
    const durata = mutaState.durataTotal;

    const sloturi = [];
    for(let t = start; t + durata <= end; t += SLOT_STEP){
      if(esteAzi && t <= acumMin) continue;
      const suprapune = ocupat.some(([os,oe]) => t < oe && (t+durata) > os);
      if(!suprapune) sloturi.push(t);
    }
    if(sloturi.length === 0){
      wrap.innerHTML = '<div class="empty">Nu există ore libere în această zi pentru durata programării.</div>';
      return;
    }
    wrap.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'slotsGridAdmin';
    let selMin = null;
    sloturi.forEach(t => {
      const el = document.createElement('div');
      el.className = 'slotAdmin';
      el.textContent = toHHMM(t);
      el.onclick = () => {
        grid.querySelectorAll('.slotAdmin').forEach(s => s.classList.remove('on'));
        el.classList.add('on');
        selMin = t;
        mutaState.noulStart = toHHMM(t);
        mutaState.noulEnd = toHHMM(t + durata);
        mutaState.noulData = dataAleasa;
        document.getElementById('btnConfirmaMutare').disabled = false;
      };
      grid.appendChild(el);
    });
    wrap.appendChild(grid);
  });
}

function confirmaMutarea(){
  if(!mutaState || !mutaState.noulStart) return;
  document.getElementById('btnConfirmaMutare').disabled = true;
  const updates = {};
  const base = 'programari/' + mutaState.frizerId + '/' + mutaState.apptId;
  updates[base + '/data'] = mutaState.noulData;
  updates[base + '/oraStart'] = mutaState.noulStart;
  updates[base + '/oraEnd'] = mutaState.noulEnd;
  if(mutaState.uid){
    const baseClient = 'programariClienti/' + mutaState.uid + '/' + mutaState.apptId;
    updates[baseClient + '/data'] = mutaState.noulData;
    updates[baseClient + '/oraStart'] = mutaState.noulStart;
    updates[baseClient + '/oraEnd'] = mutaState.noulEnd;
  }
  db.ref().update(updates).then(() => {
    inchideModalMutare();
    // reincarcam vederile relevante
    incarcaProgramari();
    if(document.getElementById('tabCalendar').style.display !== 'none') renderCalendar();
  }).catch(e => {
    document.getElementById('mutaErr').textContent = 'Eroare la mutare: ' + e.message;
  }).finally(() => {
    document.getElementById('btnConfirmaMutare').disabled = false;
  });
}

// ---------- TAB CLIENTI (obiceiuri) ----------
function incarcaClienti(){
  const wrap = document.getElementById('listaClienti');
  wrap.innerHTML = '<div class="empty"><span class="spinner"></span> Se calculează obiceiurile clienților...</div>';

  db.ref('programari/' + selFrizer).once('value').then(snap => {
    let items = [];
    snap.forEach(c => items.push(Object.assign({apptId:c.key}, c.val())));
    items = items.filter(it => it.status !== 'anulata');

    // grupare dupa uid (sau telefon daca lipseste uid)
    const grupuri = {};
    items.forEach(it => {
      const cheie = it.uid || it.telefon || it.nume || 'necunoscut';
      if(!grupuri[cheie]) grupuri[cheie] = { nume: it.nume, telefon: it.telefon, datas: [] };
      grupuri[cheie].datas.push(it.data);
    });

    let clienti = Object.values(grupuri).map(g => {
      const datas = g.datas.slice().sort();
      const nrVizite = datas.length;
      let intervalMediu = null;
      if(datas.length >= 2){
        let sumeDiff = 0, nrDiff = 0;
        for(let i=1; i<datas.length; i++){
          const d1 = new Date(datas[i-1] + 'T00:00:00');
          const d2 = new Date(datas[i] + 'T00:00:00');
          const diffZile = Math.round((d2 - d1) / 86400000);
          if(diffZile > 0){ sumeDiff += diffZile; nrDiff++; }
        }
        if(nrDiff > 0) intervalMediu = Math.round(sumeDiff / nrDiff);
      }
      return {
        nume: g.nume, telefon: g.telefon, nrVizite,
        primaData: datas[0], ultimaData: datas[datas.length-1],
        intervalMediu
      };
    });

    clienti.sort((a,b) => b.ultimaData.localeCompare(a.ultimaData));

    if(clienti.length === 0){
      wrap.innerHTML = '<div class="empty">Nu există încă date despre clienți.</div>';
      return;
    }

    wrap.innerHTML = '';
    clienti.forEach(c => {
      const div = document.createElement('div');
      div.className = 'clientCard';
      div.innerHTML = `
        <div class="client">${c.nume || 'Client necunoscut'}</div>
        <div class="contact">📞 <a href="tel:${c.telefon}">${c.telefon || '-'}</a></div>
        <div class="habitRow">
          <div class="habitBox"><div class="lbl">Vizite</div><div class="val">${c.nrVizite}</div></div>
          <div class="habitBox"><div class="lbl">Ultima</div><div class="val">${formatDataScurt(c.ultimaData)}</div></div>
          <div class="habitBox"><div class="lbl">Obicei</div><div class="val">${c.intervalMediu ? 'la ~' + c.intervalMediu + ' zile' : '—'}</div></div>
        </div>
      `;
      wrap.appendChild(div);
    });
  });
}

function formatDataScurt(dstr){
  const luni = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'];
  const d = new Date(dstr + 'T00:00:00');
  return d.getDate() + ' ' + luni[d.getMonth()];
}

function formatDataRo(dstr){
  const zile = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
  const luni = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','noi','dec'];
  const d = new Date(dstr + 'T00:00:00');
  return zile[d.getDay()] + ', ' + d.getDate() + ' ' + luni[d.getMonth()];
}
